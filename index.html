<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Move Money Booth</title>
<!--
  Visa Direct forum booth: kiosk demo for a 16:9 touch LED / TV (designed at 1920x1080, scales to any size).
  The phone screens are generated from the Figma prototypes (screens/gen/*, see scripts/gen/build-screens.mjs).
  URL params:
    ?zone=send|vxbs-individual|vxbs-seller|aft-family|aft-travel  lock this screen to one experience (one TV each;
                                the short keys receive|collect|family|travel also work). No param = home chooser.
    ?idle=60                    seconds without touch before returning to the attract screen
    ?qr=https://...             link encoded in the end-screen QR (default https://vd-booth-demo.vercel.app/)
    ?reload=2                   hours between automatic page reloads (only on the attract screen, 0 = off)
    ?fx=low                     lighter background animation for weaker media players
    ?goto=home | send:3 | done:collect | travel:5   jump straight to a screen (step is 1-based; for testing)
    ?solo=send-1                render one phone screen only, unscaled at its full Figma height (verification)
    ?solo=receive-2&clip=1      the same screen in the kiosk viewport (402x874, AFT 414x896; fixed header and footer)
  Keys: F fullscreen · Esc attract screen · 1–5 open SEND / VXBS individual / VXBS seller / AFT family / AFT travel
  Brand: Visa pack "Payments in Motion · Money Movement Edition" (brand/, vendor/fonts/VisaDialect-Regular.ttf, web use
  approved by the client 2026-11-11); the shell copy lives in app.js META.
-->
<!-- all assets are local so the booth runs fully offline (open index.html from disk) -->
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link href="vendor/inter.css" rel="stylesheet">
<style>
:root{--navy:#071a78;--blue:#1434cb;--electric:#2f9bff;--gold:#f7b600;--teal:#22d3ae;--ink:#0b1240;--muted:#c3cff8;--ok:#19c37d;--z:#2f9bff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Visa Dialect',Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;font-synthesis:none;color:#fff;touch-action:manipulation}
/* Visa Dialect has one weight: the shell sets every text to 400 (hierarchy by size), the phone screens keep Figma's fonts */
#app *:not(.fr):not(.fr *){font-weight:400!important}
.fr{font-synthesis:weight style}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:linear-gradient(160deg,#0a2a95 0%,#1336c9 42%,#0f2db8 68%,#08207a 100%)}
/* Payments in Motion KV (brand/kv-reference.jpg): Visa blue with soft diagonal light streaks, drifting slowly */
#kv{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden} /* exactly the stage: overflow here would make #stage scrollable (scrollIntoView would shift the whole kiosk) */
/* streaks: soft radial gradients (no filter: blur, which repaints every frame on weak players), moved by transform only */
#kv i{position:absolute;display:block;width:1600px;height:300px;transform:rotate(-21deg);will-change:transform;opacity:.9;animation:streak 26s ease-in-out infinite alternate}
#kv i:nth-child(1){left:860px;top:80px;background:radial-gradient(closest-side,rgba(255,222,120,.95),rgba(255,214,107,.45) 45%,transparent)}
#kv i:nth-child(2){left:-160px;top:1040px;background:radial-gradient(closest-side,rgba(247,182,0,.95),rgba(255,207,74,.4) 45%,transparent);animation-duration:31s;animation-delay:-8s}
#kv i:nth-child(3){left:280px;top:1150px;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(232,238,255,.4) 45%,transparent);animation-duration:22s;animation-delay:-4s}
#kv i:nth-child(4){left:-320px;top:380px;background:radial-gradient(closest-side,rgba(80,150,255,.6),transparent);animation-duration:35s}
#kv i:nth-child(5){left:1280px;top:-80px;background:radial-gradient(closest-side,rgba(90,168,255,.6),transparent);height:220px;animation-duration:28s;animation-delay:-12s}
#kv i:nth-child(6){left:1480px;top:1010px;background:radial-gradient(closest-side,rgba(240,138,58,.6),transparent);height:220px;animation-duration:24s;animation-delay:-6s}
@keyframes streak{from{transform:rotate(-21deg) translate(-140px,40px)}to{transform:rotate(-21deg) translate(140px,-40px)}}
.lowfx #kv i{animation:none}
#bg{position:absolute;top:0;right:0;bottom:0;left:0;width:1920px;height:1080px;opacity:.45;transition:opacity .4s}
#stage.idle-view #bg{opacity:0}
#shade{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:radial-gradient(ellipse 65% 60% at 50% 50%,rgba(6,22,110,.35) 0%,rgba(6,22,110,.22) 60%,rgba(6,22,110,.08) 100%)}
#app{position:absolute;top:0;right:0;bottom:0;left:0}

/* ---------- brand corner (per journey, Q7) ---------- */
.brand{position:absolute;right:64px;top:48px;display:flex;align-items:baseline;gap:12px;z-index:5}
.vw{font-weight:900;font-style:italic;letter-spacing:-1px}
.brand .vw{font-size:40px}
.brand .mark{display:flex;align-items:center;gap:10px}
.brand .logo{height:40px;width:auto;display:block}
.brand .lockup{height:44px;width:auto;display:block}
.brand .vp{font-size:30px;letter-spacing:-.3px;margin-top:6px}
.logo-xl{display:block;height:300px;width:auto;margin:8px auto 36px}
.brand .vd{font-size:20px;font-weight:600;color:var(--muted)}
.brand.co{flex-direction:column;align-items:flex-end;gap:2px} /* co-brand: partner bank under the Visa mark, clear of the phone */

/* ---------- idle / attract ---------- */
.idle{position:absolute;top:0;right:0;bottom:0;left:0;cursor:pointer;overflow:hidden;animation:kv-in .55s cubic-bezier(.4,0,.2,1) both}
/* the Make's SplashScreen.tsx motion, timings and easings as there */
@keyframes kv-in{from{opacity:0;filter:blur(18px);transform:scale(1.03)}to{opacity:1;filter:blur(0);transform:none}}
.idle .kv-bg{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden}
.idle .kv-bg img{display:block;width:100%;height:100%;object-fit:cover;animation:kv-zoom 12s ease-out both}
@keyframes kv-zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
.idle .kv-streaks span{position:absolute;left:0;height:1px;border-radius:99px;pointer-events:none;transform:translateX(-30vw);animation:kv-streak 8s ease-in infinite both}
@keyframes kv-streak{from{transform:translateX(-576px)}to{transform:translateX(2496px)}}
.idle .kv-logo{animation:kv-drop .7s .4s ease both}
@keyframes kv-drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.idle .kv-title,.idle .kv-city{animation:kv-slide 1s .2s cubic-bezier(.22,1,.36,1) both}
@keyframes kv-slide{from{opacity:0;transform:translateX(-28px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.idle .kv-start{animation:kv-fade .5s 1.4s both}
/* legibility over the KV's white streak (the Make darkens the whole splash; here only the start block) */
.idle .src{text-shadow:0 2px 18px rgba(4,18,90,.75)}
.idle .touch{background:rgba(8,28,120,.62);border-color:rgba(255,255,255,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 10px 40px rgba(4,18,90,.35)}
@keyframes kv-fade{from{opacity:0}to{opacity:1}}
#stage.idle-view #kv{opacity:0}
#stage.idle-view #kv i{animation-play-state:paused} /* hidden: do not keep compositing it */
/* light mode (?fx=low, and every TV browser): no full-screen blur, fewer moving layers */
.lowfx .idle{animation-name:kv-in-low}
@keyframes kv-in-low{from{opacity:0}to{opacity:1}}
.lowfx .idle .kv-title,.lowfx .idle .kv-city{animation-name:kv-slide-low}
@keyframes kv-slide-low{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.lowfx .idle .kv-streaks span:nth-child(n+5){display:none}
.lowfx .idle .touch{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(8,28,120,.8)}
.lowfx .idle .touch::before,.lowfx .idle .touch::after{animation:none;opacity:0}
/* the KV layout at 1920×1080: logo (104,84), title lockup (410,429)-(1508,650), the city under EDITION */
.idle .kv-logo{position:absolute;left:104px;top:84px;width:268px;height:auto}
/* accent sweep under the title, as the Make splash (#3aa0ff → #f7b600) */
.idle .kv-sweep{position:absolute;left:750px;top:716px;width:420px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#3aa0ff,#f7b600,transparent);transform-origin:center;animation:sweep .8s .8s cubic-bezier(.22,1,.36,1) both}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.idle .kv-title{position:absolute;left:410px;top:429px;width:1098px;height:auto}
.idle .kv-city{position:absolute;left:1152px;top:660px;font-size:30px;letter-spacing:.3px}
.idle .kv-start{position:absolute;left:0;right:0;bottom:150px;display:flex;flex-direction:column;align-items:center;gap:26px}
.idle .mm{font-size:54px;font-weight:600;letter-spacing:16px;color:#cfe0ff;padding-left:16px}
.idle .vw{font-size:250px;line-height:.95;letter-spacing:-6px;margin:8px 0 36px;padding-right:20px;
  background:linear-gradient(180deg,#fff 20%,#8fb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.src{display:flex;gap:34px;align-items:center;font-size:46px;font-weight:800;letter-spacing:12px}
.src i{width:12px;height:12px;border-radius:50%;background:var(--electric);opacity:.7}
.src b{animation:hl 6s infinite;opacity:.55}
.src b:nth-of-type(2){animation-delay:2s}.src b:nth-of-type(3){animation-delay:4s}
@keyframes hl{0%,40%,100%{opacity:.55;text-shadow:none}10%,30%{opacity:1;text-shadow:0 0 30px var(--c)}}
.idle .touch{text-transform:uppercase;letter-spacing:.28em;font-size:24px;animation:tap 2s ease-in-out infinite}
@keyframes tap{0%,100%{opacity:.85}50%{opacity:.3}}
.touch{position:relative;padding:24px 56px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);font-size:28px;font-weight:600;letter-spacing:2px}
.touch::before,.touch::after{content:'';position:absolute;top:-2px;right:-2px;bottom:-2px;left:-2px;border-radius:99px;border:2px solid rgba(47,155,255,.7);animation:ripple 2.4s infinite}
.touch::after{animation-delay:1.2s}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(1.3,1.9);opacity:0}}
.touch b{color:var(--z)}

/* ---------- home ---------- */
.home{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;padding-top:130px}
.home h1{font-size:76px;font-weight:800;letter-spacing:-1.5px}
.home .k{font-size:28px;color:var(--muted);margin-top:14px}
.cards{display:flex;gap:56px;margin-top:76px}
.zc{width:500px;height:600px;border-radius:40px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.03));
  padding:48px;text-align:left;color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:transform .15s}
.zc:active{transform:scale(.97)}
.zc::before{content:'';position:absolute;right:-140px;top:-140px;width:400px;height:400px;border-radius:50%;background:radial-gradient(var(--z),transparent 70%);opacity:.4}
.zc .ic{width:110px;height:110px;border-radius:32px;background:var(--z);display:grid;place-items:center;color:#071030;box-shadow:0 0 60px rgba(47,155,255,.45);box-shadow:0 0 60px color-mix(in srgb,var(--z) 60%,transparent)}
.zc .ic svg{width:56px;height:56px}
.zc h2{font-size:72px;font-weight:900;letter-spacing:6px;margin-top:46px}
.zc q{font-size:30px;font-weight:600;margin-top:14px;color:#e6edff;quotes:none}
.zc .pr{margin-top:auto;font-size:20px;color:var(--muted);line-height:1.4}
.zc .go{margin-top:20px;display:flex;justify-content:space-between;align-items:center;font-size:24px;font-weight:700;padding-top:22px;border-top:1px solid rgba(255,255,255,.15)}
.zc .go span{color:var(--z);font-size:34px}
/* five experiences: SEND (one tall card) | RECEIVE (2×2) */
.groups{display:flex;gap:56px;margin-top:56px;align-items:stretch}
.grp h3{font-size:22px;font-weight:800;letter-spacing:8px;color:var(--muted);margin:0 0 18px 6px}
.grp .cards{margin-top:0;gap:32px}
.grp.g4 .cards{display:grid;grid-template-columns:repeat(2,520px);gap:32px}
.grp .zc{width:440px;height:664px;padding:40px}
.grp.g4 .zc{width:520px;height:316px;padding:32px 36px}
.grp .zc h2{font-size:46px;letter-spacing:0;font-weight:800;margin-top:34px;line-height:1.05}
.grp.g4 .zc h2{font-size:34px;margin-top:18px}
.grp .zc .via{font-size:19px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--z);margin-top:10px}
.grp .zc q{font-size:26px}
.grp.g4 .zc q{font-size:20px;margin-top:10px;line-height:1.3}
.grp.g4 .zc .ic{width:68px;height:68px;border-radius:20px}
.grp.g4 .zc .ic svg{width:36px;height:36px}
.grp.g4 .zc .go{padding-top:14px;font-size:20px}
.grp.g4 .zc .go span{font-size:28px}
.grp.g4 .zc::before{width:300px;height:300px;right:-110px;top:-110px}
.zone-pill em{font-style:normal;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:4px}
.zone-pill em::before{content:'·';margin-right:14px;color:rgba(255,255,255,.35)}
/* F&F: whose phone the visitor is looking at (storyboard swimlane) */
.lane{position:absolute;left:1010px;top:14px;transform:translateX(0);display:flex;gap:12px;align-items:baseline;padding:8px 20px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);font-size:17px;z-index:4}
.lane span{letter-spacing:3px;font-weight:800;color:var(--z)}
.lane b{font-weight:700}

/* ---------- flow ---------- */
.flow::before{content:'';position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,rgba(6,24,120,.9) 0%,rgba(6,24,120,.66) 36%,transparent 52%);pointer-events:none}
.left{position:absolute;left:120px;top:120px;width:760px}
.zone-pill{display:inline-flex;align-items:center;gap:16px;padding:12px 30px 12px 12px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);font-weight:800;font-size:24px;letter-spacing:6px}
.zone-pill .ic{width:44px;height:44px;border-radius:50%;background:var(--z);display:grid;place-items:center;color:#071030}
.zone-pill svg{width:24px;height:24px}
.hero{font-size:64px;line-height:1.05;font-weight:800;letter-spacing:-1.5px;margin:28px 0 16px}
.prod{font-size:24px;color:var(--muted)}
.steps{margin-top:32px;display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:20px;font-size:24px;font-weight:500;color:rgba(255,255,255,.42);transition:color .3s}
.step .n{width:42px;height:42px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.22);display:grid;place-items:center;font-weight:700;font-size:18px}
.step.on{color:#fff;font-weight:700}
.step.on .n{background:var(--z);border-color:transparent;color:#071030;box-shadow:0 0 0 8px rgba(255,255,255,.18);box-shadow:0 0 0 8px color-mix(in srgb,var(--z) 22%,transparent)}
.step.ok{color:rgba(255,255,255,.75)}
.step.ok .n{background:rgba(25,195,125,.18);border-color:var(--ok);color:var(--ok)}
.steps.compact{gap:6px;margin-top:26px}
.steps.compact .step{font-size:20px;gap:16px}
.steps.compact .step .n{width:34px;height:34px;font-size:15px}
.steps.compact .step.on .n{box-shadow:0 0 0 6px rgba(255,255,255,.18);box-shadow:0 0 0 6px color-mix(in srgb,var(--z) 22%,transparent)}
/* the 18-step AFT journeys: two columns, filled top to bottom */
.steps.dense{display:grid;grid-auto-flow:column;grid-template-rows:repeat(9,auto);grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;row-gap:6px}
.steps.dense .step{font-size:18px;gap:14px;white-space:nowrap}
.steps.dense .step .n{width:32px;height:32px;font-size:14px;flex-shrink:0}
.kbtn{height:76px;padding:0 44px;border-radius:99px;border:0;background:#fff;color:var(--ink);font-weight:800;font-size:28px;display:inline-flex;align-items:center;gap:16px;position:relative;
  box-shadow:0 12px 40px rgba(0,0,0,.35)}
.kbtn span{color:var(--blue);font-size:30px}
.kbtn:active{transform:scale(.97)}
.kbtn.pulse::before,.kbtn.pulse::after{content:'';position:absolute;top:-3px;right:-3px;bottom:-3px;left:-3px;border-radius:99px;border:3px solid var(--z);animation:ripple 2s infinite;pointer-events:none}
.kbtn.pulse::after{animation-delay:1s}
/* kiosk Next / Finish: outside the phone, at its bottom-right edge (phone right = 1010 + (pw + 28) × 1.08) */
.knav{position:absolute;bottom:56px;display:flex;flex-direction:column;gap:16px;align-items:flex-start;z-index:5}
.knav.s402{left:1500px}
.knav.s414{left:1513px}
/* scroll cue (app.js scrollHint): a pill with a bouncing chevron, outside the phone above Next */
.scroll-cue{display:inline-flex;align-items:center;gap:12px;height:60px;padding:0 26px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font:700 20px/1 Inter,sans-serif;cursor:pointer}
.scroll-cue i{display:block;width:22px;height:14px;color:var(--z);animation:cue-bounce 1.2s ease-in-out infinite}
.scroll-cue i svg{display:block;width:22px;height:14px}
.scroll-cue:active{transform:scale(.97)}
@keyframes cue-bounce{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
.nav{position:absolute;left:120px;bottom:64px;display:flex;gap:16px}
.ghost{height:64px;padding:0 32px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font-weight:600;font-size:22px}
.ghost:active{background:rgba(255,255,255,.18)}
.route{position:absolute;right:64px;top:150px;max-width:330px;padding:20px 26px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);text-align:right}
.route span{display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--z);font-weight:800}
.route span::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--z);animation:blink 1.4s infinite}
.route b{display:block;font-size:22px;margin-top:6px;line-height:1.3}
@keyframes blink{50%{opacity:.25}}

/* ---------- done ---------- */
.done-l{position:absolute;left:120px;top:140px;width:880px}
.done .hero{font-size:80px;margin:30px 0 22px}
.lead{font-size:28px;color:#dbe5ff;line-height:1.4}
.pw{margin-top:40px;padding:28px 32px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15)}
.pw span{font-size:16px;letter-spacing:3px;text-transform:uppercase;color:var(--z);font-weight:800}
.pw b{display:block;font-size:30px;margin:6px 0 10px}
.pw p{font-size:20px;color:var(--muted);line-height:1.5}
.btns{display:flex;gap:18px;margin-top:44px}
.btn{height:76px;padding:0 40px;border-radius:99px;font-weight:700;font-size:24px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff}
.btn.primary{background:#fff;color:var(--ink);border:0}
.btn:active{transform:scale(.97)}
.qr-card{position:absolute;right:160px;top:210px;width:520px;background:#fff;color:var(--ink);border-radius:36px;padding:48px;text-align:center;
  box-shadow:0 30px 120px rgba(0,0,0,.5),0 0 0 12px rgba(255,255,255,.08);animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
#qr{width:300px;height:300px;margin:0 auto;display:grid;place-items:center}
#qr img,#qr canvas{width:300px!important;height:300px!important}
.qr-card h3{font-size:32px;font-weight:800;margin:26px 0 12px}
.qr-card ul{list-style:none;font-size:20px;color:#3d4875;line-height:1.9}
</style>
<link href="screens/gen/screens.css" rel="stylesheet">
<link href="screens/phone.css" rel="stylesheet">
<script src="vendor/qrcode.min.js"></script>
</head>
<body>
