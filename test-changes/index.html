<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Test changes · Feedback 16/11</title>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link href="../vendor/inter.css" rel="stylesheet">
<!--
  Client feedback 2026-11-16: every fixed item, in English (default) or Vietnamese; the client's own words always stay
  in English. Each item: feedback verbatim → the image the email carried → Figma evidence (changes against Figma) →
  analysis and self-decided points → before / after on the production domain, the change boxed.
  Images and boxes: docs/feedback/2026-11-16/ (before = production at 4c31b5d, after-deployed = production after the fix;
  annotations.json = boxes measured from the DOM of both builds).
-->
<style>
:root{--blue:#1434cb;--navy:#1a1f71;--bg:#f3f5fb;--card:#fff;--ink:#16192b;--muted:#6b7085;--line:#e3e5ee;--ok:#16a34a;
  --c-mine:#dc2626;--c-shell:#7c3aed;--c-asset:#d97706;--c-new:#0e7490}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Visa Dialect',Inter,system-ui,sans-serif}
a{color:var(--blue)}
.top{background:var(--navy);color:#fff;padding:22px 24px}
.top .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top img{height:24px}
.top h1{font:400 24px/1.2 'Visa Dialect',Inter,sans-serif;margin:0}
.top p{margin:4px 0 0;opacity:.8;font-size:14px}
.top .home-btn{margin-left:auto;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:7px 16px;font-size:14px}
.top .home-btn:hover{background:rgba(255,255,255,.12)}
.top .home-btn::before{content:'‹';margin-right:8px}
main{max-width:1240px;margin:0 auto;padding:10px 16px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:99px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;color:#fff}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:14px 0;border-left:6px solid var(--cc)}
.head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--cc);color:#fff;display:grid;place-items:center;font-weight:600}
.item h3{font:400 19px/1.3 'Visa Dialect',Inter,sans-serif;margin:3px 0 0;flex:1;min-width:240px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:12.5px;border-radius:99px;padding:3px 10px;background:#eef0f7;color:var(--ink);white-space:nowrap}
.tag.cause{background:var(--cc);color:#fff}
.tag.done{background:#dcfce7;color:#166534}
.tag.dec{background:#fef3c7;color:#92400e}
.step{margin-top:16px}
.step h5{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px;font:600 14px/1.3 Inter,sans-serif}
.step h5 span{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px}
.step h5 small{font-weight:400;color:var(--muted);font-size:12.5px}
blockquote{margin:0;padding:12px 16px;border-left:4px solid var(--cc);background:#f7f8fc;border-radius:0 10px 10px 0;font-size:15px;font-style:italic}
blockquote cite{display:block;margin-top:6px;font-style:normal;color:var(--muted);font-size:12.5px}
.note{color:var(--muted);font-size:13.5px;margin:0 0 8px}
.mails{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.mail{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;background:#fff}
.mimg{border:0;background:none;border-radius:6px}
.mimg img{display:block;max-width:100%;border-radius:6px;border:1px solid var(--line)}
.mimg.dark img{background:#1a1f71;padding:8px}
.mimg.nofile{display:none}
.mvid{display:block;width:100%;max-height:420px;border-radius:6px;background:#000}
.meta{display:grid;grid-template-columns:120px 1fr;gap:4px 14px;margin:0;font-size:14px}
.meta dt{color:var(--muted)}.meta dd{margin:0}
.decs{margin-top:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;font-size:14px}
.decs > b{display:block;color:#92400e;margin-bottom:6px}
.decs dl{display:grid;grid-template-columns:120px 1fr;gap:3px 14px;margin:0}
.decs dl + dl{margin-top:10px;padding-top:10px;border-top:1px dashed #fcd34d}
.decs dt{color:#92400e}.decs dd{margin:0}
.pairs{display:grid;gap:16px}
.pair h4{margin:0 0 6px;font:600 13px/1.3 Inter,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba.phone{grid-template-columns:repeat(2,minmax(0,300px))}
.ba.phone.three{grid-template-columns:repeat(3,minmax(0,300px))}
figure{margin:0;background:#f7f8fc;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;display:flex;flex-direction:column}
figcaption{font:600 12px/1 Inter,sans-serif;padding:7px 10px;color:#fff;background:#3b3f56}
figure.after figcaption{background:var(--ok)}
figure.figma figcaption{background:#a259ff}
.gone{display:grid;place-items:center;min-height:220px;color:var(--muted);font-size:14px;text-align:center;padding:20px;cursor:default}
.pic{position:relative;display:block}
.pic img{display:block;width:100%;height:auto}
.ov{position:absolute;inset:0;pointer-events:none}
.bx{position:absolute;border:3px solid;border-radius:8px;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.bx b{position:absolute;left:-3px;top:-22px;font:700 11px/1 Inter,sans-serif;color:#fff;padding:4px 6px;border-radius:6px 6px 6px 0}
.bx.red{border-color:#e11d48}.bx.red b{background:#e11d48}
.bx.green{border-color:#16a34a}.bx.green b{background:#16a34a}
.bx.ghost{border:3px dashed #e11d48;background:rgba(225,29,72,.08)}.bx.ghost b{background:#e11d48}
#overview{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-top:16px}
#overview h2{font:400 20px/1.2 'Visa Dialect',Inter,sans-serif;margin:0 0 4px}
#overview .note{margin:0 0 10px}
#overview h3{font:600 13px/1.3 Inter,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.ov-t{width:100%;border-collapse:collapse;font-size:14px}
.ov-t td{border-top:1px solid var(--line);padding:7px 8px;vertical-align:top}
.ov-t td:first-child{width:44px;white-space:nowrap}
.ov-t td:last-child{width:120px;white-space:nowrap;color:#166534}
.ov-t a{color:var(--ink);text-decoration:none;font-weight:600}
.ov-t a:hover{color:var(--blue)}
.ov-t q{quotes:none;font-style:italic}
.ov-t .old td:last-child{color:var(--muted)}
#lb{position:fixed;inset:0;background:rgba(10,12,30,.92);display:none;z-index:20;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}
#lb .lbpic{display:inline-block;position:relative}
#lb .lbpic img{display:block;max-width:calc(100vw - 32px);max-height:calc(100vh - 90px);width:auto;height:auto;border-radius:8px;background:#fff}
#lb .cap{color:#fff;margin-top:10px;font-size:14px;text-align:center}
#lb .x{position:absolute;right:16px;top:12px;background:none;border:0;color:#fff;font-size:30px;cursor:pointer}
@media (max-width:700px){.bar{position:static}.ba,.ba.phone{grid-template-columns:1fr 1fr}.ba.phone.three{grid-template-columns:1fr 1fr 1fr}.meta,.decs dl{grid-template-columns:1fr}.meta dt{margin-top:6px}}
</style>
</head>
<body>

  <img src="../brand/visa-direct-lockup.svg" alt="Visa Direct">

var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var state = { cause: 'all', lang: 'en' }, ANN = {};
try { state.lang = localStorage.getItem('tc-lang') || 'en'; } catch (e) {}
var L = function (v) { return typeof v === 'string' ? v : v[state.lang]; };
var t = function (k) { return UI[state.lang][k]; };

// boxes in the image's own pixels → percentages: red on the old build and Figma, green on the new, dashed = removed
function boxes(sz, list, cls) {
  return (list || []).map(function (b, i) {
    var p = 6, x = (b[0] - p) / sz.w * 100, y = (b[1] - p) / sz.h * 100, w = (b[2] + 2 * p) / sz.w * 100, h = (b[3] + 2 * p) / sz.h * 100;
    return '<i class="bx ' + cls + '" style="left:' + x + '%;top:' + y + '%;width:' + w + '%;height:' + h + '%"><b>' + (i + 1) + '</b></i>';
  }).join('');
}
function pick(arr, idx) { return idx ? idx.map(function (i) { return arr[i]; }).filter(Boolean) : arr; }
function figure(src, cap, kind, label, sz, bx) {
  if (!src) return '<figure class="gone"><div>' + t('gone') + '</div></figure>';
  return '<figure class="' + kind + '" data-src="' + src + '" data-cap="' + esc(label + ' · ' + cap) + '"><figcaption>' + cap + '</figcaption><span class="pic"><img loading="lazy" src="' + src + '" alt="">' +
    (sz && bx ? '<span class="ov">' + bx + '</span>' : '') + '</span></figure>';
}
// the email's image (left blank when the file is not there) or attachment, with what it shows
function emailBlock(i) {
  if (!i.email) return '<p class="note">' + t('noImg') + '</p>';
  return '<div class="mails">' + i.email.map(function (m) {
    if (m.video) return '<div class="mail"><video class="mvid" src="' + IMG + m.video + '" controls playsinline preload="metadata"></video><b>📎 ' + esc(m.name) + '</b><span>' + esc(L(m.desc)) + '</span></div>';
    var src = m.img ? IMG + m.img.replace(/\(/g, '%28').replace(/\)/g, '%29') : '';
    var img = m.img ? '<figure class="mimg' + (m.dark ? ' dark' : '') + '" data-src="' + src + '" data-cap="' + esc('#' + i.n + ' · ' + m.name) + '"><span class="pic"><img src="' + src + '" alt="" onerror="this.closest(\'figure\').classList.add(\'nofile\')"></span></figure>' : '';
    return '<div class="mail">' + img + '<b>' + (m.attach ? '📎 ' : '') + esc(m.name) + '</b><span>' + esc(L(m.desc)) + '</span></div>';
  }).join('') + '</div>';
}
// the Figma original for a result row: the item's figma entry for the same screen (s-<key> or <key>)
function figmaFor(i, shot) {
  var f = (i.figma || []).filter(function (x) { return x[1] === shot || 's-' + x[1] === shot; })[0];
  if (!f) return '';
  var a = ANN[f[1]], label = '#' + i.n + ' ' + L(f[0]);
  return a && a.figma ? figure(IMG + a.figma.img, t('figma'), 'figma', label, a.figma, boxes(a.figma, pick(a.figma.boxes, f[2]), 'red'))
    : figure(IMG + 'figma/' + f[1] + '.png', t('figma'), 'figma', label);
}
// decOk: approved on 17/11; the decision stays in the data for reference but is not shown
function decBlock(i) {
  if (!i.dec || i.decOk) return '';
  return '<div class="decs"><b>' + t('decTitle') + '</b>' + i.dec.map(function (d) {
    var x = d[state.lang];
    return '<dl><dt>' + t('unclear') + '</dt><dd>' + esc(x[0]) + '</dd><dt>' + t('chosen') + '</dt><dd>' + esc(x[1]) + '</dd><dt>' + t('later') + '</dt><dd>' + esc(x[2]) + '</dd></dl>';
  }).join('') + '</div>';
}
function shotsBlock(i, step) {
  return '<section class="step"><h5><span>' + step + '</span>' + t('s4') + ' <small>' + t('legend') + '</small></h5><div class="pairs">' + i.shots.map(function (p) {
    var label = L(p[0]), phone = p[1].charAt(0) === 's', a = ANN[p[1]], sel = p[2] || {}, afterFile = p.length > 3 ? p[3] : p[1];
    var bb = a ? boxes(a.before, pick(a.before.boxes, sel.b), 'red') : '';
    var ab = a ? boxes(a.after, pick(a.after.boxes, sel.a), 'green') + (sel.ghost ? boxes(a.after, pick(a.before.boxes, sel.ghost), 'ghost') : '') : '';
    var fg = figmaFor(i, p[1]);
    return '<div class="pair"><h4>' + esc(label) + '</h4><div class="ba' + (phone ? ' phone' : '') + (fg ? ' three' : '') + '">' + fg +
      figure(IMG + 'before/' + p[1] + '.jpg', t('before'), 'before', '#' + i.n + ' ' + label, a && a.before, bb) +
      figure(afterFile ? IMG + 'after-deployed/' + afterFile + '.jpg' : null, t('after'), 'after', '#' + i.n + ' ' + label, a && a.after, ab) + '</div></div>';
  }).join('') + '</div></section>';
}
// the request list from the email, to confirm every request has its item
var OLD = [
  ['Hoa Nguyen · 12/11 14:03', 'Màu chủ đạo của Travel app: Em đổi giúp chị thành màu vàng nhé, ở Visa kỵ màu đỏ mà chị quên mất', { en: 'Done 13/11: Travel wallet primary colour #f7b600 (Visa gold).', vi: 'Xong 13/11: màu chủ đạo Travel wallet #f7b600 (vàng Visa).' }],
  ['Hoa Nguyen · 12/11 14:03', 'E-seller withdrawal via VXBS: theo chị thấy thì trải nghiệm này chưa cover hết các screen', { en: 'Closed 12/11: all 8 screens were there (cache); Hoa replied "Chị làm được rồi".', vi: 'Đã đóng 12/11: đủ 8 màn (do cache trình duyệt); chị Hoa trả lời "Chị làm được rồi".' }]
];
function overview() {
  var row = function (i) { return '<tr><td><a href="#item-' + i.n + '">#' + i.n + '</a></td><td><q lang="en">' + esc(i.quote) + '</q></td><td>✓ ' + t('fixedOn') + '</td></tr>'; };
  var group = function (who) { return ITEMS.filter(function (i) { return i.time === who; }).map(row).join(''); };
  return '<h2>' + t('ovTitle') + '</h2><p class="note">' + t('ovNote') + '</p>' +
    '<h3>' + t('ovNat') + '</h3><table class="ov-t">' + group(NAT) + '</table>' +
    '<h3>' + t('ovHoa') + '</h3><table class="ov-t">' + group(HOA) + '</table>' +
    '<h3>' + t('ovOld') + '</h3><table class="ov-t">' + OLD.map(function (o) { return '<tr class="old"><td>–</td><td><q>' + esc(o[1]) + '</q><br><span class="note">' + esc(o[0]) + ' · ' + esc(L(o[2])) + '</span></td><td>✓</td></tr>'; }).join('') + '</table>';
}
function render() {
  document.documentElement.lang = state.lang;
  [].forEach.call(document.querySelectorAll('[data-t]'), function (e) { e.textContent = t(e.dataset.t); });
  $('#overview').innerHTML = overview();
  var counts = {}; ITEMS.forEach(function (i) { counts[i.cause] = (counts[i.cause] || 0) + 1; });
  $('#filters').innerHTML = '<button class="chip" data-c="all">' + t('all') + ' · ' + ITEMS.length + '</button>' + Object.keys(CAUSE).map(function (k) {
    return '<button class="chip" data-c="' + k + '"><i style="background:' + CAUSE[k].color + '"></i>' + CAUSE[k][state.lang] + ' · ' + counts[k] + '</button>';
  }).join('');
  $('#items').innerHTML = ITEMS.filter(function (i) { return state.cause === 'all' || i.cause === state.cause; }).map(function (i) {
    var c = CAUSE[i.cause], k = 0;
    return '<article class="item" id="item-' + i.n + '" style="--cc:' + c.color + '"><div class="head"><span class="num">' + i.n + '</span><h3>' + esc(L(i.title)) + '</h3>' +
      '<div class="tags"><span class="tag">' + i.time.split(' ')[0] + '</span><span class="tag cause">' + c[state.lang] + '</span><span class="tag done">' + t('done') + '</span>' + (i.dec && !i.decOk ? '<span class="tag dec">' + t('hasDec') + '</span>' : '') + '</div></div>' +
      '<section class="step"><h5><span>' + (++k) + '</span>' + t('s1') + '</h5><blockquote lang="en">' + esc(i.quote) + '<cite>' + esc(i.time) + ' · ' + t('from') + '</cite></blockquote></section>' +
      (i.email ? '<section class="step"><h5><span>' + (++k) + '</span>' + t('s2') + '</h5>' + emailBlock(i) + '</section>' : '') +
      '<section class="step"><h5><span>' + (++k) + '</span>' + t('s3') + '</h5><dl class="meta"><dt>' + t('fixed') + '</dt><dd>' + esc(L(i.fix)) + '</dd><dt>' + t('cause') + '</dt><dd>' + esc(L(i.why)) + '</dd>' +
        (i.figmaNote ? '<dt>' + t('figmaRow') + '</dt><dd>' + esc(L(i.figmaNote)) + '</dd>' : '') + '</dl>' + decBlock(i) + '</section>' +
      shotsBlock(i, ++k) + '</article>';
  }).join('');
  [].forEach.call(document.querySelectorAll('#filters .chip'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.c === state.cause)); });
  [].forEach.call(document.querySelectorAll('#lang button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === state.lang)); });
  $('#lb .x').setAttribute('aria-label', t('close'));
}
$('#filters').addEventListener('click', function (e) { var b = e.target.closest('.chip'); if (b) { state.cause = b.dataset.c; render(); } });
$('#lang').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; state.lang = b.dataset.v; try { localStorage.setItem('tc-lang', state.lang); } catch (err) {} render(); });
fetch(IMG + 'annotations.json').then(function (r) { return r.json(); }).then(function (d) { ANN = d; }).catch(function () {}).then(render);

// lightbox: the image with its boxes; ←/→ moves through the images on the page
var lb = $('#lb'), figs = [], at = 0;
function open(i) { figs = [].slice.call(document.querySelectorAll('figure[data-src]')); at = (i + figs.length) % figs.length; $('.lbpic', lb).innerHTML = figs[at].querySelector('.pic').innerHTML; $('.cap', lb).textContent = figs[at].dataset.cap + '  (←/→)'; lb.classList.add('on'); }
document.addEventListener('click', function (e) { var f = e.target.closest('figure[data-src]'); if (f) open([].indexOf.call(document.querySelectorAll('figure[data-src]'), f)); });
lb.addEventListener('click', function (e) { if (e.target === lb || e.target.classList.contains('x')) lb.classList.remove('on'); });
document.addEventListener('keydown', function (e) { if (!lb.classList.contains('on')) return; if (e.key === 'Escape') lb.classList.remove('on'); if (e.key === 'ArrowRight') open(at + 1); if (e.key === 'ArrowLeft') open(at - 1); });
})();
</script>
</body>
</html>
